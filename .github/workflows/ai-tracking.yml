name: AI Development Tracking

on:
  push:
    branches:
      - 'ai-dev/**'

jobs:
  track-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install dependencies
        working-directory: ./aplikasi_laravel
        run: composer install --no-interaction --prefer-dist
        
      - name: Run Laravel tests
        working-directory: ./aplikasi_laravel
        run: php artisan test
        
      - name: Show AI discussion log
        run: |
          echo "=== AI Discussion Summary ==="
          cat orchestrator/memory/latest_discussion.json | python3 -m json.tool
