; Override upload limit untuk video.
; Deploy: cp ke /etc/php/8.x/fpm/conf.d/99-uploads.ini lalu restart PHP-FPM.
; Prioritas conf.d: angka 99 menang atas file lain.

upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 768M
max_execution_time = 600
max_input_time = 600
max_file_uploads = 20
